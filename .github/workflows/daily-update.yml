name: daily-update

on:
  schedule:
    - cron: '0 2 * * *'          # UTC 02:00 ≈ 北京 10:00
    - cron: '0 14 * * *'         # UTC 14:00 ≈ 北京 22:00（当日"收盘"快照 → extended 全量）
    - cron: '0 8 * * 0'          # UTC 周日 08:00：全量新闻回填班
  workflow_dispatch:
    inputs:
      at:
        description: '快照时间戳（补录历史时间点用，ISO8601 UTC，如 2026-11-01T02:00:00Z）'
        required: false
      deploy_only:
        description: '快速部署：跳过采集/数据提交，重建 site/ 后发布'
        type: boolean
        default: false
        required: false
      extended:
        description: '强制 extended 全量抓取（topics/watchers/issues 细分）——14:00 班自动开启'
        type: boolean
        default: false
        required: false

permissions:
  contents: write
  issues: write

jobs:
  # ---------------- plan: 全局决策一次跑 ----------------
  # discovery → watchlist 合并 → pick_fetches → plan.json / watchlist.json
  # 作为 artifact 交给下游；此处不做任何 git 写。
  plan:
    if: ${{ !inputs.deploy_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      shards: ${{ steps.shards.outputs.list }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit tests (rank math)
        run: python -m unittest discover -s tests

      - name: Plan collection
        run: python scripts/collect.py --role=plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT_AT: ${{ inputs.at }}

      - id: shards
        run: |
          python3 -c "import json; n=json.load(open('data/collect-plan/plan.json'))['n_shards']; print(f'list={json.dumps(list(range(int(n))))}')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: collect-plan
          path: data/collect-plan/
          retention-days: 1

  # ---------------- shard: 16 路并行抓取 ----------------
  # md5(full_name)%16 分片；每 job 独立 GITHUB_TOKEN 速率预算。
  # 单片失败不连坐（fail-fast:false），reduce 用 carry-forward 降级补齐。
  shard:
    needs: plan
    if: ${{ !inputs.deploy_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        k: ${{ fromJSON(needs.plan.outputs.shards || '[]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: collect-plan
          path: data/collect-plan/

      - name: Fetch shard ${{ matrix.k }}
        run: python scripts/collect.py --role=shard --shard=${{ matrix.k }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRR_EXTENDED: ${{ (github.event.schedule == '0 14 * * *' || inputs.extended) && '1' || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collect-plan-metrics-${{ matrix.k }}
          path: data/collect-plan/metrics-${{ matrix.k }}.json
          retention-days: 1
          if-no-files-found: ignore

  # ---------------- reduce: 唯一写者 ----------------
  # 合并全部 metrics-*.json → carry-forward → 快照/meta/watchlist →
  # rank → commit → 发布。git 写只在发生在这里，天然零竞速。
  reduce:
    needs: [plan, shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: daily-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100        # 够 pull --rebase 用即可；site/ 产物已不入库

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # collect-plan* 同时命中 collect-plan（plan.json/watchlist.json）
      # 和 collect-plan-metrics-K，merge-multiple 合并进同一目录
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.deploy_only }}
        with:
          pattern: 'collect-plan*'
          path: data/collect-plan/
          merge-multiple: true

      - name: Merge shards & write snapshot
        if: ${{ !inputs.deploy_only }}
        run: python scripts/collect.py --role=reduce

      - name: Fetch repo news (HN + Google/Bing News)
        if: ${{ !inputs.deploy_only }}
        continue-on-error: true
        run: |
          if [ "${{ github.event.schedule }}" = "0 8 * * 0" ]; then
            python scripts/news.py --all
          else
            python scripts/news.py --board
          fi

      - name: Report trending status via rescue issue
        if: ${{ !inputs.deploy_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ci_rescue.py

      - name: Rebuild rankings & site data
        run: python scripts/rank.py --site-base "${{ vars.SITE_BASE }}"  # site/ 不入库，deploy_only 也要重建才能发布

      - name: Commit data updates
        if: ${{ !inputs.deploy_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "data: snapshot $(date -u +%FT%H:%MZ)"
          PRE=$(git rev-parse HEAD)
          if ! git pull --rebase origin main; then
            # 冲突只可能出现在可再生成的文件（site/data、sitemap、robots）上：
            # 取远端版本（rebase 中 --ours 指向 rebase 目标=上游），继续后再重建，
            # 保证生成产物与合并后的 data/ 一致
            git status --porcelain | awk '$1 ~ /^(UU|AA|DD|AU|UA|DU|UD)$/{print $2}' | xargs -r git checkout --ours
            git status --porcelain | awk '$1 ~ /^(UU|AA|DD|AU|UA|DU|UD)$/{print $2}' | xargs -r git add
            GIT_EDITOR=true git rebase --continue
            python scripts/rank.py --site-base "${{ vars.SITE_BASE }}"
            git add -A
            git diff --cached --quiet || git commit -m "data: rebuild after rebase"
          elif ! git diff --quiet "$PRE" HEAD -- data/; then
            # 干净 rebase：远端（如救援机）推了新的采集数据进来，而本地
            # site/data 是 rebase 前生成的——重建保证产物与合并后的 data/ 一致
            python scripts/rank.py --site-base "${{ vars.SITE_BASE }}"
            git add -A
            git diff --cached --quiet || git commit -m "data: rebuild after rebase"
          fi
          git push

      # site/data/* 以单文件 sqlite blob 形式推给 api-site（Cloudflare Pages
      # 部署上限 2 万文件，data/ 一棵树就占 ~1.6 万）。上传必须先于站点
      # 发布——失败则中止，宁可不发也不让页面上线后水合不到数据。
      - name: Pack + upload data store to api-site
        env:
          DATA_UPLOAD_TOKEN: ${{ secrets.DATA_UPLOAD_TOKEN }}
        run: |
          python3 scripts/pack_data.py
          gzip -9 -c site-data.db > site-data.db.gz   # 188MB → ~57MB on the wire
          SHA=$(sha256sum site-data.db.gz | cut -d' ' -f1)
          RESP=$(curl -fsS -X POST "https://api-site.zhuikan.com/data-upload" \
            -H "Authorization: Bearer $DATA_UPLOAD_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @site-data.db.gz)
          echo "$RESP"
          echo "$RESP" | grep -q "$SHA" || \
            { echo "::error::sha256 mismatch — upload corrupted"; exit 1; }

      # 站点 ~90MB/万级文件，超出 actions/deploy-pages 的 10 分钟文件同步预算；
      # 改为推送到 gh-pages 分支由 Pages 服务端构建（无超时限制）。
      - name: Publish site to gh-pages
        run: |
          rm -rf /tmp/ghp-site
          cp -a site /tmp/ghp-site
          cd /tmp/ghp-site
          # Cloudflare 代理 css/js 静态资源 ~4h——把 ?v=<sha> 戳进所有 html
          # 的资产引用，HTML 本身 DYNAMIC 不缓存，发版即生效
          V="$(echo "${{ github.sha }}" | cut -c1-8)"
          find . -name "*.html" -exec sed -i -E \
            -e "s#(assets/[a-zA-Z0-9_./-]+\.(css|js))\"#\1?v=${V}\"#g" \
            -e "s#(assets/[a-zA-Z0-9_./-]+\.(css|js)\?v=)[0-9A-Za-z_-]+#\1${V}#g" \
            {} +
          git init -qb gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "deploy $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:gh-pages

      # 主发布目标：Cloudflare Pages。wrangler 按内容 hash 增量上传，
      # 无 per-file 发布瓶颈；gh-pages 分支留作冷备（含完整 data/）。
      # CF 载荷剔除 site/data/——那棵树改由 api-site 的 blob store 服务，
      # 部署文件数从 ~2.7 万压到 ~7 千，留足 2 万上限余量。
      - name: Deploy to Cloudflare Pages
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # 上一步失败时 /tmp/ghp-site 可能是半成品——宁可跳过也不发布残缺站点
          test -f /tmp/ghp-site/index.html || { echo "site payload missing; skipping deploy"; exit 1; }
          rm -rf /tmp/cfp-site && mkdir -p /tmp/cfp-site
          rsync -a --exclude 'data/' /tmp/ghp-site/ /tmp/cfp-site/
          echo "deploy payload: $(find /tmp/cfp-site -type f | wc -l) files"
          npx -y wrangler@3 pages deploy /tmp/cfp-site --project-name=zhuikan --branch=main
