name: daily-update

on:
  schedule:
    - cron: '0 2 * * *'          # UTC 02:00 ≈ 北京 10:00
    - cron: '0 14 * * *'         # UTC 14:00 ≈ 北京 22:00（当日"收盘"快照）
    - cron: '0 8 * * 0'          # UTC 周日 08:00：全量新闻回填班
  workflow_dispatch:
    inputs:
      at:
        description: '快照时间戳（补录历史时间点用，ISO8601 UTC，如 2026-11-01T02:00:00Z）'
        required: false
      deploy_only:
        description: '快速部署：跳过采集/重建/数据提交，直接发布 site/'
        type: boolean
        default: false
        required: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: daily-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect snapshot
        if: ${{ !inputs.deploy_only }}
        run: python scripts/collect.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT_AT: ${{ inputs.at }}

      - name: Fetch repo news (HN + Google/Bing News)
        if: ${{ !inputs.deploy_only }}
        continue-on-error: true
        run: |
          if [ "${{ github.event.schedule }}" = "0 8 * * 0" ]; then
            python scripts/news.py --all
          else
            python scripts/news.py --board
          fi

      - name: Report trending status via rescue issue
        if: ${{ !inputs.deploy_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ci_rescue.py

      - name: Rebuild rankings & site data
        if: ${{ !inputs.deploy_only }}
        run: python scripts/rank.py --site-base "${{ vars.SITE_BASE }}"

      - name: Commit data updates
        if: ${{ !inputs.deploy_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ site/
          git diff --cached --quiet || git commit -m "data: snapshot $(date -u +%FT%H:%MZ)"
          if ! git pull --rebase origin main; then
            # 冲突只可能出现在可再生成的文件（site/data、sitemap、robots）上：
            # 取远端版本（rebase 中 --ours 指向 rebase 目标=上游），继续后再重建，
            # 保证生成产物与合并后的 data/ 一致
            git status --porcelain | awk '$1=="UU"||$1=="AA"{print $2}' | xargs -r git checkout --ours
            git status --porcelain | awk '$1=="UU"||$1=="AA"{print $2}' | xargs -r git add
            GIT_EDITOR=true git rebase --continue
            python scripts/rank.py --site-base "${{ vars.SITE_BASE }}"
            git add data/ site/
            git diff --cached --quiet || git commit -m "data: rebuild after rebase"
          fi
          git push

      # 站点 ~90MB/万级文件，超出 actions/deploy-pages 的 10 分钟文件同步预算；
      # 改为推送到 gh-pages 分支由 Pages 服务端构建（无超时限制）。
      - name: Publish site to gh-pages
        run: |
          rm -rf /tmp/ghp-site
          cp -a site /tmp/ghp-site
          cd /tmp/ghp-site
          # Cloudflare 代理 css/js 静态资源 ~4h——把 ?v=<sha> 戳进所有 html
          # 的资产引用，HTML 本身 DYNAMIC 不缓存，发版即生效
          V="$(echo "${{ github.sha }}" | cut -c1-8)"
          find . -name "*.html" -exec sed -i -E \
            -e "s#(assets/[a-zA-Z0-9_./-]+\.(css|js))\"#\1?v=${V}\"#g" \
            -e "s#(assets/[a-zA-Z0-9_./-]+\.(css|js)\?v=)[0-9A-Za-z_-]+#\1${V}#g" \
            {} +
          git init -qb gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "deploy $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
