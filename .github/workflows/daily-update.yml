name: daily-update

on:
  schedule:
    - cron: '0 2 * * *'          # UTC 02:00 ≈ 北京 10:00
    - cron: '0 14 * * *'         # UTC 14:00 ≈ 北京 22:00（当日"收盘"快照）
  workflow_dispatch:
    inputs:
      at:
        description: '快照时间戳（补录历史时间点用，ISO8601 UTC，如 2026-11-01T02:00:00Z）'
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: daily-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect snapshot
        run: python scripts/collect.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT_AT: ${{ inputs.at }}

      - name: Rebuild rankings & site data
        run: python scripts/rank.py --site-base "${{ vars.SITE_BASE }}"

      - name: Commit data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ site/
          git diff --cached --quiet || git commit -m "data: snapshot $(date -u +%FT%H:%MZ)"
          git pull --rebase origin main && git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
